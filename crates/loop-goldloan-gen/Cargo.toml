[package]
name = "loop-goldloan-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Gold-loan workflow simulator: human-sim vs staged tool-calling agents over a deterministic mock backend, emitting synthetic traces"

[[bin]]
name = "loop-goldloan-gen"
path = "src/main.rs"

[dependencies]
loop-ai = { workspace = true }
loop-agent = { workspace = true, features = ["sqlite"] }
loop-app-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
rand = "0.8"
dotenvy = "0.15"
reqwest = { workspace = true, features = ["json"] }
uuid = { workspace = true }
base64 = { workspace = true }
