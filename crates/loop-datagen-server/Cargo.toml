[package]
name = "loop-datagen-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "gRPC agent server for the headless-harness datagen pipeline, backed by loop-agent"

[[bin]]
name = "loop-datagen-server"
path = "src/main.rs"

[dependencies]
loop-ai = { workspace = true }
loop-agent = { workspace = true, features = ["sqlite"] }
loop-app-core = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
protoc-bin-vendored = "3"
