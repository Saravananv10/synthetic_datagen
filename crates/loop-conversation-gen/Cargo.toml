[package]
name = "loop-conversation-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Multi-persona long-conversation synthetic dataset generator, backed by loop-agent"

[[bin]]
name = "loop-conversation-gen"
path = "src/main.rs"

[[bin]]
name = "loop-group-conversation-gen"
path = "src/bin/group.rs"

[dependencies]
loop-ai = { workspace = true }
loop-agent = { workspace = true, features = ["sqlite"] }
loop-app-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
parking_lot = { workspace = true }
rand = "0.8"
dotenvy = "0.15"
